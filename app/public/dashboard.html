<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>NdurePlan</title>
    <link rel="stylesheet" href="css/app.css">
    <script>
        // Apply the saved theme before the first paint.
        try { const t = JSON.parse(localStorage.getItem('ndure.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">NdurePlan</a>
        <nav class="topnav" aria-label="Main">
            <button type="button" data-action="nav" data-view="plan">Plan</button>
            <button type="button" data-action="nav" data-view="settings">Settings</button>
        </nav>
        <div class="top-right">
            <span class="save-status" id="save-status" aria-live="polite"></span>
            <span class="user-email" id="user-email"></span>
            <button type="button" class="icon-btn" data-action="sign-out" aria-label="Sign out" title="Sign out">
                <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
        </div>
    </header>
    <div id="banner" class="banner" role="alert" hidden></div>

    <main id="main">
        <section id="view-plan" aria-label="Plan"><p class="loading">Loading…</p></section>
        <section id="view-today" aria-label="Today" hidden></section>
        <section id="view-settings" aria-label="Settings" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Main">
        <button type="button" data-action="nav" data-view="plan">
            <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            Week
        </button>
        <button type="button" data-action="nav" data-view="today">
            <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            Today
        </button>
        <button type="button" data-action="nav" data-view="settings">
            <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
            Settings
        </button>
    </nav>

    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

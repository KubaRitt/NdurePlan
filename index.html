<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ndure · Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="brand"><i></i>Ndure</div>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to your training diary.</p>

    <div class="card">
      <button id="google"><svg class="g-icon" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>

      <div class="or">or</div>

      <div class="tabs">
        <button id="tab-in" class="on" type="button">Sign in</button>
        <button id="tab-up" type="button">Create account</button>
      </div>

      <form id="form" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" autocomplete="current-password">
        <div style="height:16px"></div>
        <button class="primary" id="submit" type="submit">Sign in</button>
      </form>
      <div style="margin-top:12px;text-align:center"><a href="#" id="forgot" style="font-size:13px;color:var(--mute)">Forgot password?</a></div>
      <div class="msg" id="msg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(NDURE.url, NDURE.key);
    const $ = (id) => document.getElementById(id);
    const msg = (t, cls = "") => { $("msg").textContent = t; $("msg").className = "msg " + cls; };
    let mode = "in";

    // Already signed in (or just back from Google / email confirm) → go to the app
    sb.auth.getSession().then(({ data }) => { if (data.session) location.replace("calendar.html"); });
    sb.auth.onAuthStateChange((_e, s) => { if (s) location.replace("calendar.html"); });

    function setMode(m) {
      mode = m;
      $("tab-in").classList.toggle("on", m === "in");
      $("tab-up").classList.toggle("on", m === "up");
      $("submit").textContent = m === "in" ? "Sign in" : "Create account";
      $("title").textContent = m === "in" ? "Welcome back" : "Create your account";
      $("subtitle").textContent = m === "in" ? "Sign in to your training diary." : "Start syncing Garmin with your diary.";
      $("password").autocomplete = m === "in" ? "current-password" : "new-password";
      msg("");
    }
    $("tab-in").onclick = () => setMode("in");
    $("tab-up").onclick = () => setMode("up");

    $("google").onclick = async () => {
      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: new URL("calendar.html", location.href).href },
      });
      if (error) msg(error.message, "err");
    };

    $("form").onsubmit = async (e) => {
      e.preventDefault();
      const email = $("email").value.trim(), password = $("password").value;
      $("submit").disabled = true; msg("…");
      const res = mode === "in"
        ? await sb.auth.signInWithPassword({ email, password })
        : await sb.auth.signUp({ email, password, options: { emailRedirectTo: new URL("calendar.html", location.href).href } });
      $("submit").disabled = false;
      if (res.error) return msg(res.error.message, "err");
      if (mode === "up" && !res.data.session) msg("Check your inbox to confirm your email.", "ok");
    };

    $("forgot").onclick = async (e) => {
      e.preventDefault();
      const email = $("email").value.trim();
      if (!email) return msg("Type your email first.", "err");
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL("index.html", location.href).href });
      msg(error ? error.message : "Reset link sent.", error ? "err" : "ok");
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ndure · Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --c-hr: #e11d48; --c-body: #0284c7;              /* HR load / body load */
      --c-w7: #4f46e5; --c-w14: #0d9488; --c-w28: #d97706; /* rolling windows */
      --good-bg: #dcfce7; --good-fg: #166534; --low-bg: #e0f2fe; --low-fg: #075985;
      --warn-bg: #fef3c7; --warn-fg: #92400e; --bad-bg: #fee2e2; --bad-fg: #991b1b;
    }
    .page { max-width: 1160px; margin: 0 auto; padding: 24px 16px 56px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .head h1 { margin: 0; font-size: 22px; }
    .head p { margin: 2px 0 0; color: var(--mute); font-size: 13px; }

    /* ---- hero tiles ---- */
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 700px) { .tiles { grid-template-columns: 1fr; } }
    @media (max-width: 420px) { .tiles { gap: 8px; } }
    .tile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 10px; position: relative; overflow: hidden; transition: border-color .15s, box-shadow .15s; animation: rise .45s var(--spring) both; }
    .tile:hover { border-color: #d4d4d8; }
    .tile.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
    .tile:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    .tile .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .tile .lbl { font-size: 12px; font-weight: 650; color: var(--text-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .tile .lbl i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .tile .big { font-size: 32px; font-weight: 700; letter-spacing: -.035em; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .tile .big small { font-size: 13px; font-weight: 600; color: var(--mute); letter-spacing: 0; margin-left: 3px; }
    .tile .cap { font-size: 11px; color: var(--mute); margin-top: 1px; }
    .tile .wins { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
    .tile .wins b { color: var(--text-2); font-weight: 650; }
    .tile svg { display: block; width: 100%; height: 34px; margin-top: 8px; }
    @media (max-width: 420px) { .tile { padding: 12px 10px 8px; } .tile .big { font-size: 26px; } .tile .wins { gap: 8px; font-size: 11px; } .tile .top { flex-direction: column; align-items: flex-start; } }
    .chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .chip.low { background: var(--low-bg); color: var(--low-fg); } .chip.good { background: var(--good-bg); color: var(--good-fg); }
    .chip.warn { background: var(--warn-bg); color: var(--warn-fg); } .chip.bad { background: var(--bad-bg); color: var(--bad-fg); }
    .chip.none { background: var(--panel-2); color: var(--mute); }

    /* ---- panels ---- */
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 12px; margin-top: 14px; animation: rise .45s var(--spring) both; }
    .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 6px; }
    .ph h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .ph p { margin: 2px 0 0; font-size: 12px; color: var(--mute); max-width: 560px; }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-top: 10px; }
    @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
    .grid2 h3 { font-size: 13px; margin: 0; }
    .seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
    .seg button { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; color: var(--mute); display: inline-flex; align-items: center; gap: 6px; }
    .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .seg button:focus-visible { outline: 2px solid var(--text); }
    .seg button i { width: 7px; height: 7px; border-radius: 50%; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .ctrl { margin: 4px 0 8px; }
    .ctrl .sp { flex: 1; }
    .seg button:disabled { opacity: .35; cursor: default; }
    .custom { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mute); }
    .custom[hidden] { display: none; }
    .custom input { font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); width: auto; }

    .chart { position: relative; height: 250px; margin-top: 4px; }
    .chart.sm { height: 210px; }
    .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .chart text { font-size: 10px; fill: var(--mute); font-variant-numeric: tabular-nums; }
    .chart text.dl { font-size: 11px; font-weight: 650; fill: var(--text-2); }
    .tip { position: absolute; top: 0; z-index: 5; pointer-events: none; background: #18181b; color: #fff; font-size: 11px; line-height: 1.55; padding: 7px 9px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; transform: translateX(-50%); opacity: 0; transition: opacity .12s; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .tip.on { opacity: 1; }
    .tip i { display: inline-block; width: 9px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
    .tip .z { opacity: .7; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin-top: 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 3px; border-radius: 2px; }
    .legend i.sq { width: 9px; height: 9px; border-radius: 2px; }

    /* zone summary bar */
    .zbar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 8px 0 4px; }
    .zbar div { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #18181b; min-width: 0; overflow: hidden; white-space: nowrap; transform-origin: left; animation: grow .6s var(--spring) both; }
    @keyframes grow { from { transform: scaleX(0); } }
    .zlab { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; min-height: 18px; }
    .zlab span { display: inline-flex; align-items: center; gap: 5px; }
    .zlab i { width: 9px; height: 9px; border-radius: 2px; }
    .zlab b { color: var(--text); font-weight: 650; }
    .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11px; color: var(--mute); margin: 8px 0 0; min-height: 50px; }
    .stats b { display: block; font-size: 18px; color: var(--text); letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.3; }

    /* sport table */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; }
    @media (max-width: 480px) { td small { font-size: 10px; } td, th { padding-left: 6px; padding-right: 6px; } }
    th { text-align: right; font-size: 11px; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; padding-left: 0; }
    td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-2); }
    tr:last-child td { border-bottom: 0; }
    td .s { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    td .s i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    td b { font-weight: 650; }
    td small { display: block; color: var(--mute); font-size: 11px; }
    tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; }
    .hint { font-size: 12px; font-weight: 500; color: var(--mute); margin-left: 6px; letter-spacing: 0; }
    .chart.strip { height: 46px; margin-top: 2px; }
    .now { display: flex; gap: 6px; flex-wrap: wrap; }
    .empty { color: var(--mute); font-size: 13px; padding: 36px 0; text-align: center; }
    .note { font-size: 11px; color: var(--mute); margin-top: 8px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--text); color: #fff; font-size: 13px; font-weight: 550; padding: 10px 16px; border-radius: 10px; transition: transform .4s var(--spring), opacity .2s; z-index: 60; max-width: calc(100vw - 32px); }
    .toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.err { background: var(--danger); }
    .busy { opacity: .6; pointer-events: none; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="in">
      <div style="display:flex;align-items:center">
        <a class="brand" href="calendar.html"><i></i>Ndure</a>
        <nav><a href="calendar.html">Calendar</a><a class="on" href="dashboard.html">Dashboard</a><a href="settings.html">Settings</a></nav>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="who" id="who"></span>
        <button class="inline ghost" id="logout">Sign out</button>
      </div>
    </div>
  </header>

  <main class="page" id="app" hidden>
    <div class="head">
      <div><h1>Dashboard</h1></div>
      <button class="inline" id="sync">Sync last 120 days</button>
    </div>

    <!-- 1 · where you are now -->
    <div class="tiles" id="tiles"></div>

    <!-- 2 · rolling sums -->
    <section class="panel">
      <div class="ph">
        <div><h2 id="roll-title">Load</h2><p id="roll-sub"></p></div>
        <div class="seg" id="r-metric" aria-label="Metric"></div>
      </div>
      <div class="filters ctrl">
        <div class="seg" id="r-win" aria-label="Rolling window"></div>
        <div class="seg" id="r-unit" aria-label="Volume unit"><button data-v="t" class="on">Time</button><button data-v="km">Km</button></div>
        <div class="seg" id="r-type" aria-label="Chart type"><button data-v="line" class="on">Line</button><button data-v="bar">Bars</button></div>
        <span class="sp"></span>
        <div class="seg" id="r-range" aria-label="Range"><button data-v="7">1 W</button><button data-v="30">1 M</button><button data-v="90" class="on">3 M</button><button data-v="custom">Custom</button></div>
        <span class="custom" id="r-custom" hidden><input type="date" id="r-from" aria-label="From"><span>–</span><input type="date" id="r-to" aria-label="To"></span>
      </div>
      <div class="chart" id="rchart"></div>
      <div class="legend" id="rleg"></div>
    </section>

    <!-- 3 · heart vs legs -->
    <section class="panel">
      <div class="ph">
        <div><h2>Heart vs legs <span class="hint" title="Last 7 days as % of your 28-day average week. 80–130 % = steady.">% of normal week</span></h2></div>
        <div class="now" id="bal-now"></div>
      </div>
      <div class="chart" id="bchart"></div>
      <div class="chart strip" id="bdaily"></div>
      <div class="legend"><span><i style="background:var(--c-hr)"></i>HR load</span><span><i style="background:var(--c-body)"></i>Body load</span><span><i class="sq" style="background:#f0fdf4;border:1px solid #bbf7d0"></i>80–130 %</span><span style="color:var(--mute)">bars: daily load</span></div>
    </section>

    <!-- 4 · distributions -->
    <section class="panel" style="padding-bottom:14px">
      <div class="ph">
        <div><h2>Time distribution <span class="hint" id="d-note"></span></h2></div>
        <div class="filters"><div class="seg" id="d-sport" aria-label="Sport"></div><div class="seg" id="d-period" aria-label="Period"><button data-v="7">7 d</button><button data-v="28" class="on">28 d</button><button data-v="90">90 d</button></div></div>
      </div>
      <div class="grid2">
        <div>
          <h3>Heart rate</h3>
          <div class="zbar" id="zbar"></div><div class="zlab" id="zlab"></div>
          <div class="chart sm" id="hchart"></div>
        </div>
        <div>
          <h3 id="s-title">Pace</h3>
          <div class="stats" id="sstats"></div>
          <div class="chart sm" id="schart"></div>
        </div>
      </div>
      <div class="legend" style="margin-top:10px"><span><i class="sq" style="background:var(--z-easy)"></i>Easy</span><span><i class="sq" style="background:var(--z-ap1)"></i>AP1</span><span><i class="sq" style="background:var(--z-ap2)"></i>AP2</span><span><i class="sq" style="background:var(--z-ap3)"></i>AP3</span><span id="d-prev-leg"><i class="sq" style="background:transparent;border:1.5px solid var(--text-2)"></i>previous period</span></div>
    </section>

    <!-- 5 · per sport -->
    <section class="panel">
      <div class="ph"><div><h2>Per sport · rolling</h2></div></div>
      <div class="tbl-wrap"><table id="tbl"></table></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="laps.js"></script>
  <script src="metrics.js"></script>
  <script>
    const sb = supabase.createClient(NDURE.url, NDURE.key);
    const L = NdureLaps, M = NdureMetrics(sb);
    const $ = (id) => document.getElementById(id);
    const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const SHOW = 90, BACK = 27; // default graph days + history needed before the first 28-day window
    const WIN = [7, 14, 28];
    const FAM = [["run", "Run"], ["bike", "Bike"], ["ski", "Ski"], ["swim", "Swim"], ["walk", "Walk"], ["strength", "Strength"], ["other", "Other"]];
    const FAML = Object.fromEntries(FAM);
    const hm = (s) => { s = Math.round((s || 0) / 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
    const hmL = (s) => { s = Math.round((s || 0) / 60); return s >= 60 ? `${Math.floor(s / 60)} h ${String(s % 60).padStart(2, "0")} min` : `${s} min`; };
    const paceS = (p) => `${Math.floor(p / 60)}:${String(Math.round(p % 60)).padStart(2, "0")}`;
    const dLabel = (d) => new Date(d + "T00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

    // metric definitions (tiles + load chart)
    const MET = {
      hr:   { label: "HR load",   unit: "", color: "var(--c-hr)",   fmt: (x) => String(Math.round(x)), ratio: true },
      body: { label: "Body load", unit: "", color: "var(--c-body)", fmt: (x) => String(Math.round(x)), ratio: true },
      vol:  { label: "Volume",    unit: "h", color: "#52525b",      fmt: (x) => hm(x * 3600) },
    };
    const WCOL = { 7: "var(--c-w7)", 14: "var(--c-w14)", 28: "var(--c-w28)" };
    let items = [], acts = [], metrics = {}, zones = {}, daily = null, ready = false, loadedFrom = null;
    let dSport = null, dPeriod = 28;
    // load chart state
    let rMetric = "hr", rWin = "all", rUnit = "t", rType = "line", rRange = "90", rFrom = null, rTo = null;

    function toast(t, err) {
      const el = $("toast"); el.textContent = t; el.className = "toast on" + (err ? " err" : "");
      clearTimeout(toast.t); toast.t = setTimeout(() => (el.className = "toast"), err ? 6000 : 3500);
    }

    // ================= data =================
    // from = first day to load (needs 27 days before the first day shown, for the 28-day windows)
    async function load(from = ymd(addDays(today, -(SHOW + BACK - 1)))) {
      const to = ymd(today);
      const [a, s] = await Promise.all([
        sb.from("garmin_activities").select("activity_id,date,family,sport_key,duration_s,distance_m").gte("date", from).lte("date", to),
        sb.from("diary_sessions").select("date,family,duration_min,distance_km,activity_id").gte("date", from).lte("date", to).is("activity_id", null),
      ]);
      if (a.error || s.error) toast((a.error || s.error).message, true);
      loadedFrom = from;
      acts = a.data ?? [];
      // Garmin activities, plus diary-only sessions (not linked) so nothing is counted twice
      items = [
        ...acts.map((x) => ({ date: x.date, f: x.family || "other", m: Number(x.distance_m) || 0, t: x.duration_s || 0 })),
        ...(s.data ?? []).map((x) => ({ date: x.date, f: x.family || "other", m: (Number(x.distance_km) || 0) * 1000, t: (Number(x.duration_min) || 0) * 60 })),
      ].filter((x) => x.m > 0 || x.t > 0);
      metrics = {}; ready = false;
      buildDaily(); renderAll();
      $("roll-sub").textContent = "Calculating load…";
      try {
        zones = await M.settings();
        metrics = await M.ensure(acts, (i, n) => ($("roll-sub").textContent = `Calculating load ${i}/${n}…`));
      } catch (e) { toast("Couldn't calculate load: " + e.message, true); }
      ready = true; $("roll-sub").textContent = "";
      buildDaily(); renderAll();
    }

    const rollOf = (v, w) => { let s = 0; return v.map((x, i) => { s += x; if (i >= w) s -= v[i - w]; return s; }); };
    function buildDaily() {
      const n = Math.round((today - new Date(loadedFrom + "T00:00")) / 864e5) + 1;
      const days = [...Array(n)].map((_, i) => ymd(addDays(today, i - n + 1)));
      const index = Object.fromEntries(days.map((d, i) => [d, i]));
      const per = days.map(() => ({ hr: 0, body: 0, t: {}, m: {} }));
      let missing = 0;
      for (const a of acts) {
        const i = index[a.date]; if (i == null) continue;
        const r = metrics[a.activity_id];
        if (!r || r.hr_load == null) { missing++; continue; }
        per[i].hr += r.hr_load; per[i].body += Number(r.body_load) || 0;
      }
      for (const x of items) { const i = index[x.date]; if (i == null) continue; per[i].t[x.f] = (per[i].t[x.f] || 0) + x.t / 3600; per[i].m[x.f] = (per[i].m[x.f] || 0) + x.m / 1000; }
      const base = {
        hr: per.map((p) => p.hr), body: per.map((p) => p.body),
        vol: per.map((p) => Object.values(p.t).reduce((a, b) => a + b, 0)),
        km: per.map((p) => Object.values(p.m).reduce((a, b) => a + b, 0)),
      };
      const roll = {};
      for (const k of Object.keys(base)) roll[k] = Object.fromEntries([1, ...WIN].map((w) => [w, w === 1 ? base[k] : rollOf(base[k], w)]));
      // HR + body: scale body so both have the same total over the loaded period, rounded to a readable number
      const sh = base.hr.reduce((a, b) => a + b, 0), sbd = base.body.reduce((a, b) => a + b, 0);
      let k = sh > 0 && sbd > 0 ? sh / sbd : 1; const p = 10 ** Math.floor(Math.log10(k)); k = Math.round((k / p) * 2) / 2 * p;
      daily = { days, index, per, base, roll, missing, k: +k.toPrecision(2) };
    }
    // last 7 days ÷ (last 28 days / 4), for day index i
    const ratioAt = (k, i) => { const c = daily.roll[k][28][i] / 4; return c > 0 ? daily.roll[k][7][i] / c : null; };
    function status(r) {
      if (r == null) return ["none", "–"];
      return r < 0.8 ? ["low", "Easing off"] : r <= 1.3 ? ["good", "Steady"] : r <= 1.5 ? ["warn", "Building fast"] : ["bad", "Spike"];
    }

    // ================= render =================
    function renderAll() { renderTiles(); renderRolling(); renderBalance(); renderDist(); renderTable(); }

    // ---- 1 · tiles ----
    function spark(vals, color) {
      const W = 240, H = 34, n = vals.length, max = Math.max(1e-9, ...vals);
      const X = (i) => (W * i) / (n - 1), Y = (v) => H - 3 - ((H - 6) * v) / max;
      const d = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${W},${H}L0,${H}Z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
    }
    function selectMetric(k) { rMetric = k; renderTiles(); renderRolling(); }
    function renderTiles() {
      const last = daily.days.length - 1, from = Math.max(0, last - SHOW + 1);
      $("tiles").innerHTML = Object.entries(MET).map(([k, m], j) => {
        const r = daily.roll[k], v7 = r[7][last];
        let chip = "", extra = "";
        if (m.ratio) { if (ready) { const x = ratioAt(k, last), [c, t] = status(x); chip = `<span class="chip ${c}" title="7 days ÷ 28-day average week">${x == null ? "–" : x.toFixed(2)} ${t}</span>`; } }
        else { const c = r[28][last] / 4, d = c > 0 ? Math.round((100 * (v7 - c)) / c) : null; if (d != null) chip = `<span class="chip none" title="vs 28-day average week">${d >= 0 ? "+" : ""}${d}%</span>`; extra = `<small style="font-weight:500">· ${daily.roll.km[7][last].toFixed(1)} km</small>`; }
        const val = m.ratio && !ready ? "…" : m.fmt(v7);
        return `<button class="tile${k === rMetric || (rMetric === "both" && m.ratio) ? " on" : ""}" data-k="${k}" style="animation-delay:${j * 0.04}s">
          <div class="top"><span class="lbl"><i style="background:${m.color}"></i>${m.label}</span>${chip}</div>

    // ---- line chart (one y-axis, crosshair, direct labels at the end) ----

    function lineChart(el, { days, lines, yMin = 0, yMax, yFmt, band, ref, tipRow }) {

    // ---- daily bars under a line chart, same x positions ----

    // ---- time bars: stacked (one bar per day) or grouped (side by side) ----

    // ---- 2 · load chart ----

    // ---- 3 · heart vs legs ----

    // ---- 4 · distributions ----
    const ZCOL = { easy: "var(--z-easy)", ap1: "var(--z-ap1)", ap2: "var(--z-ap2)", ap3: "var(--z-ap3)", none: "var(--z-none)" };
    const topRounded = (x, y, w, h, r) => { if (h <= 0) return ""; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
    function barChart(el, bars, { xLabel, ticks, marker }) {
      const W = el.clientWidth || 500, H = el.clientHeight || 210, pl = 4, pr = 4, pt = 14, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
      const n = bars.length, max = Math.max(1e-9, ...bars.map((b) => Math.max(b.v, b.p || 0))), bw = iw / n, gap = bw > 8 ? 2 : 1;
      let g = `<line x1="${pl}" x2="${pl + iw}" y1="${pt + ih}" y2="${pt + ih}" stroke="var(--line)"/>`;
      bars.forEach((b, i) => {
        const h = (ih * b.v) / max;
        g += `<path d="${topRounded(pl + i * bw + gap / 2, pt + ih - h, Math.max(1, bw - gap), h, 3)}" fill="${b.color}" class="bar" data-b="${i}"/>`;
        if (ticks(i, bw)) g += `<line x1="${pl + i * bw}" x2="${pl + i * bw}" y1="${pt + ih}" y2="${pt + ih + 3}" stroke="var(--faint)"/><text x="${pl + i * bw}" y="${H - 6}" text-anchor="middle">${xLabel(i)}</text>`;
      });
      // previous period as a step outline
      if (bars.some((b) => b.p != null)) {
        let d = ""; bars.forEach((b, i) => { const y = (pt + ih - (ih * (b.p || 0)) / max).toFixed(1); d += `${i ? "L" : "M"}${(pl + i * bw).toFixed(1)},${y}H${(pl + (i + 1) * bw).toFixed(1)}`; });
        g += `<path d="${d}" fill="none" stroke="var(--text-2)" stroke-width="1.5" stroke-linejoin="round" opacity=".75"/>`;
      }
      if (marker) { const mx = pl + marker.at * bw; g += `<line x1="${mx}" x2="${mx}" y1="${pt - 4}" y2="${pt + ih}" stroke="var(--text-2)" stroke-dasharray="3 3"/><text x="${mx + 4}" y="${pt + 4}" style="fill:var(--text-2);font-weight:650">${marker.label}</text>`; }
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars.map((_, i) => `<rect x="${pl + i * bw}" y="0" width="${bw}" height="${pt + ih}" fill="transparent" data-i="${i}"/>`).join("")}</svg><div class="tip"></div>`;
      const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
      svg.onpointermove = (e) => {
        const t = e.target.closest("[data-i]"); if (!t) return;
        const i = +t.dataset.i, r = svg.getBoundingClientRect(), sx = W / r.width;
        svg.querySelectorAll(".bar").forEach((p) => (p.style.opacity = +p.dataset.b === i ? 1 : 0.4));
        tip.innerHTML = bars[i].tip + (bars[i].p != null ? `<br><span class="z">previous: ${hmL(bars[i].p)}</span>` : ""); tip.style.left = Math.max(90, Math.min(r.width - 90, (pl + (i + 0.5) * bw) / sx)) + "px"; tip.classList.add("on");
      };
      svg.onpointerleave = () => { tip.classList.remove("on"); svg.querySelectorAll(".bar").forEach((p) => (p.style.opacity = 1)); };
    }
    // drop the thin tails (default: keep the 0.5th–99.5th percentile of time)
    // label every `every` units, choosing the smallest spacing that leaves ≥ 44 px between labels
    const every = (opts, pxPerUnit) => opts.find((o) => o * pxPerUnit >= 44) || opts[opts.length - 1];
    function trim(keys, get, q = 0.005) {
      const tot = keys.reduce((s, k) => s + get(k), 0); let acc = 0, lo = 0, hi = keys.length - 1;
      for (let i = 0; i < keys.length; i++) { acc += get(keys[i]); if (acc >= tot * q) { lo = i; break; } }
      acc = 0; for (let i = keys.length - 1; i >= 0; i--) { acc += get(keys[i]); if (acc >= tot * q) { hi = i; break; } }
      return keys.slice(lo, hi + 1);
    }
    const emptyDist = (msg) => { for (const id of ["zbar", "zlab", "sstats"]) $(id).innerHTML = ""; $("hchart").innerHTML = $("schart").innerHTML = `<div class="empty">${msg}</div>`; };
    function renderDist() {
      if (!ready) { $("d-sport").innerHTML = ""; $("d-note").textContent = ""; return emptyDist("Calculating…"); }
      const since = ymd(addDays(today, -(dPeriod - 1)));
      const inP = acts.filter((a) => a.date >= since && metrics[a.activity_id]?.hist);
      const fams = FAM.map(([f]) => f).filter((f) => inP.some((a) => (a.family || "other") === f));
      if (!dSport || !fams.includes(dSport)) dSport = fams.includes("run") ? "run" : fams[0] || null;
      $("d-sport").innerHTML = fams.map((f) => `<button data-v="${f}" class="${f === dSport ? "on" : ""}"><i style="background:var(--${f})"></i>${FAML[f]}</button>`).join("");
      $("d-sport").querySelectorAll("button").forEach((b) => (b.onclick = () => { dSport = b.dataset.v; renderDist(); }));
      const sel = inP.filter((a) => (a.family || "other") === dSport);
      // same-length period before, for the outline (only while it fits in the loaded history)
      const hasPrev = dPeriod * 2 <= daily.days.length, pSince = ymd(addDays(today, -(2 * dPeriod - 1)));
      const prev = hasPrev ? acts.filter((a) => a.date >= pSince && a.date < since && (a.family || "other") === dSport && metrics[a.activity_id]?.hist) : [];
      $("d-prev-leg").style.display = hasPrev ? "" : "none";
      $("d-note").textContent = sel.length ? `${sel.length}×` : "";
      if (!sel.length) return emptyDist("No saved activities in this period. Sync to save them.");
      const z = (zones && zones[L.zoneKey(dSport)]) || {};

      // heart rate, 5 bpm bins
      const pct = (v, t) => ((100 * v) / t).toFixed(1) + " %";
      // ---- heart rate: 2 bpm bars that start at your zone limits, so no bar is split between two zones ----
      const add = (o, h) => { for (const [k, v] of Object.entries(h || {})) o[k] = (o[k] || 0) + v; return o; };
      const hr = {}, hrP = {};
      for (const a of sel) add(hr, metrics[a.activity_id].hist.hr);
      for (const a of prev) add(hrP, metrics[a.activity_id].hist.hr);
      const hk = Object.keys(hr).map(Number).sort((a, b) => a - b), tot = hk.reduce((s, k) => s + hr[k], 0);
      if (!tot) { $("zbar").innerHTML = $("zlab").innerHTML = ""; $("hchart").innerHTML = `<div class="empty">No heart rate recorded.</div>`; }
      else {
        // zone totals over all data
        const zt = { easy: 0, ap1: 0, ap2: 0, ap3: 0, none: 0 };
        for (const k of hk) zt[L.hrZone(k, z)] += hr[k];
        const zs = Object.entries(zt).filter(([, v]) => v > 0);
        $("zbar").innerHTML = zs.map(([k, v], i) => `<div style="flex:${v};background:${ZCOL[k]};animation-delay:${i * 0.05}s" title="${L.LABEL[k]} ${hmL(v)}">${v / tot >= 0.07 ? Math.round((100 * v) / tot) + "%" : ""}</div>`).join("");
        $("zlab").innerHTML = zs.map(([k, v]) => `<span><i style="background:${ZCOL[k]}"></i>${k === "none" ? "No zones set" : L.LABEL[k]} <b>${hmL(v)}</b></span>`).join("");
        // drop the thin low end (each bpm under 0.3 % of the time)
        let lo = hk[0], hi = hk[hk.length - 1];
        while (lo < hi && (hr[lo] || 0) < tot * 0.003) lo++;
        while (hi > lo && (hr[hi] || 0) < tot * 0.0003) hi--; // keep your max efforts: only drop single stray seconds
        // zone ranges [from, to] in bpm, cut to the data
        const lim = [["easy", z.easy], ["ap1", z.ap1], ["ap2", z.ap2], ["ap3", Infinity]].filter(([, v]) => v != null && !isNaN(v));
        let ranges = [], start = lo;
        if (lim.length > 1 && z.easy != null) for (const [k, top] of lim) { const to = Math.min(hi, top); if (to >= start) ranges.push([k, start, to]); start = Math.max(start, top + 1); if (start > hi) break; }
        else ranges = [["none", lo, hi]];
        const bins = [];
        for (const [k, a, b] of ranges) {
          const n = Math.max(1, Math.round((b - a + 1) / 2)), w = (b - a + 1) / n; // ~2 bpm bars, never crossing a zone limit
          for (let j = 0; j < n; j++) {
            const x0 = Math.round(a + j * w), x1 = Math.round(a + (j + 1) * w) - 1;
            let v = 0, pv = 0; for (let h = x0; h <= x1; h++) { v += hr[h] || 0; pv += hrP[h] || 0; }
            bins.push({ lo: x0, hi: x1 + 1, v, p: hasPrev ? pv : null, color: ZCOL[k], tip: `<b>${x0}–${x1} bpm</b><br>${hmL(v)} · ${pct(v, tot)}<br><span class="z">${k === "none" ? "no zones set" : L.LABEL[k]}</span>` });
          }
        }
        histChart($("hchart"), bins, {
          bands: ranges.map(([k, a, b]) => ({ lo: a, hi: b + 1, label: k === "none" ? "" : L.SHORT?.[k] || L.LABEL[k] })),
          xLabel: (v) => String(v), edgeLabel: (v, first) => (first ? v : v - 1), // zone limits read as "≤ 150"
          ticks: (() => { const t = []; for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) t.push(v); return t; })(),
        });
      }

      // ---- speed: pace (run/walk, slow → fast left to right) or km/h, each bar coloured by the average HR at that speed ----
      const sp = {}, spP = {}; let unit = null;
      const addSp = (o, h) => { for (const [k, c] of Object.entries(h.sp || {})) { const x = (o[k] ||= [0, 0, 0]); x[0] += c[0]; x[1] += c[1]; x[2] += c[2]; } };
      for (const a of sel) { const h = metrics[a.activity_id].hist; unit = unit || h.unit; addSp(sp, h); }
      for (const a of prev) { const h = metrics[a.activity_id].hist; if (h.unit === unit) addSp(spP, h); }
      const pace = unit === "pace";
      $("s-title").textContent = pace ? "Pace (min/km)" : "Speed (km/h)";
      const sk = Object.keys(sp).map(Number).sort((a, b) => a - b);
      if (!sk.length) { $("sstats").innerHTML = ""; $("schart").innerHTML = `<div class="empty">No speed recorded for ${FAML[dSport].toLowerCase()}.</div>`; return; }
      const allT = sk.reduce((s, k) => s + sp[k][0], 0);
      // stats on everything
      let acc = 0, med = null; for (const k of sk) { acc += sp[k][0]; if (med == null && acc >= allT / 2) med = k; }
      const ep = L.loadCfg(zones).easy_pace_s;
      // variable bins: finer where it's fast (a 5 s step at 3:00/km is a much bigger change than at 6:00/km)
      //   pace: 2 s under 4:00 · 3 s to 5:00 · 5 s to 6:00 · 10 s slower;  speed: 1 km/h
      const pStep = (k) => (!pace ? 1 : k < 240 ? 2 : k < 300 ? 3 : k < 360 ? 5 : 10);
      const raw = (o, k) => (o[k] ? o[k][0] : 0);
      // range on the raw data: fast end keeps everything but the fastest 1 % (your reps live there),
      // slow end drops the slowest 5 % of the time (walking, stops, GPS noise)
      const fastEnd = pace ? sk : [...sk].reverse(), slowEnd = pace ? [...sk].reverse() : sk;
      let cf = 0, cs = 0, kf = fastEnd[0], ks0 = slowEnd[0];
      for (const k of fastEnd) { if (cf + raw(sp, k) > allT * 0.01) { kf = k; break; } cf += raw(sp, k); }
      for (const k of slowEnd) { if (cs + raw(sp, k) > allT * 0.05) { ks0 = k; break; } cs += raw(sp, k); }
      let lo = Math.min(kf, ks0), hi = Math.max(kf, ks0);
      // bin edges on a fixed grid so bins line up between periods
      const edges = []; for (let e = pace ? lo - (lo % 2) : Math.floor(lo); e <= hi; e += pStep(e)) edges.push(e);
      edges.push(edges[edges.length - 1] + pStep(edges[edges.length - 1]));
      const sumIn = (o, a, b) => { const r = [0, 0, 0]; for (const [k, c] of Object.entries(o)) if (k >= a && k < b) { r[0] += c[0]; r[1] += c[1]; r[2] += c[2]; } return r; };
      let bins = edges.slice(0, -1).map((a, n) => {
        const b = edges[n + 1], c = sumIn(sp, a, b), cp = sumIn(spP, a, b);
        const ah = c[2] ? c[1] / c[2] : null, zk = ah ? L.hrZone(ah, z) : "none";
        const lab = pace ? `${paceS(a)}–${paceS(b - 1)} /km` : `${a}–${b} km/h`;
        return { lo: a, hi: b, v: c[0], p: hasPrev ? cp[0] : null, zk, color: ZCOL[zk], tip: `<b>${lab}</b><br>${hmL(c[0])} · ${pct(c[0], allT)}<br><span class="z">avg HR ${ah ? Math.round(ah) + " bpm · " + (zk === "none" ? "no zone" : L.LABEL[zk]) : "–"}</span>` };
      });
      // slow end: also drop end bins under 1.5 % of the time
      const slowIsHigh = pace;
      while (bins.length > 2 && bins[slowIsHigh ? bins.length - 1 : 0].v < allT * 0.015) slowIsHigh ? bins.pop() : bins.shift();
      const shown = bins.reduce((a, b) => a + b.v, 0);
      // stats on everything
      const modeB = bins.reduce((a, b) => (b.v / (b.hi - b.lo) > a.v / (a.hi - a.lo) ? b : a), bins[0]);
      const mid = (a, b) => (pace ? paceS((a + b) / 2) : ((a + b) / 2).toFixed(1));
      const fast = pace ? sk.filter((k) => k < ep).reduce((a, k) => a + sp[k][0], 0) / allT : null;
      $("sstats").innerHTML = `<div><b>${mid(modeB.lo, modeB.hi)}</b>most time</div><div><b>${pace ? paceS(med) : med}</b>median</div><div><b>${hmL(allT)}</b>moving</div>` + (fast != null ? `<div><b>${Math.round(fast * 100)} %</b>faster than easy (${paceS(ep)})</div>` : "");
      // bands: walking from slow to fast, the zone only steps up (faster = harder), so you get at most one band per zone
      const RANK = { none: -1, easy: 0, ap1: 1, ap2: 2, ap3: 3 }, NAME = ["easy", "ap1", "ap2", "ap3"];
      const bands = []; let cur = -1;
      for (const b of (pace ? [...bins].reverse() : bins)) {
        if (b.v >= allT * 0.01) cur = Math.max(cur, RANK[b.zk]); // ignore near-empty bins
        const zk = cur < 0 ? "none" : NAME[cur], l = bands[bands.length - 1];
        if (l && l.zk === zk) { l.lo = Math.min(l.lo, b.lo); l.hi = Math.max(l.hi, b.hi); } else bands.push({ zk, lo: b.lo, hi: b.hi });
      }
      for (const b of bands) b.label = b.zk === "none" ? "" : L.SHORT?.[b.zk] || L.LABEL[b.zk];
      histChart($("schart"), bins, {
        tf: pace ? (v) => 1000 / v : (v) => v, bands,
        ticks: (() => { const t = [], st = pace ? 30 : 2; for (let v = Math.ceil(bins[0].lo / st) * st; v <= bins[bins.length - 1].hi; v += st) t.push(v); return t; })(),
        xLabel: (v) => (pace ? paceS(v) : String(v)),
        marker: pace && ep > bins[0].lo && ep < bins[bins.length - 1].hi ? { at: ep, label: "easy" } : null,
        foot: shown < allT * 0.995 ? `${pct(allT - shown, allT)} outside the range shown` : "",
      });
    }

    // ---- histogram with real bin widths, zone bands and labels on the zone edges ----
    // tf = x-axis transform (pace uses speed, so the fast end gets room); height = time per unit of tf
    function histChart(el, bins, { tf = (v) => v, bands = [], xLabel, edgeLabel, marker, foot, ticks = [] }) {
      const W = el.clientWidth || 500, H = el.clientHeight || 210, pl = 6, pr = 6, pt = 18, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
      const us = bins.flatMap((b) => [tf(b.lo), tf(b.hi)]), u0 = Math.min(...us), u1 = Math.max(...us), span = u1 - u0 || 1;
      const X = (v) => pl + (iw * (tf(v) - u0)) / span;
      const xs = (b) => { const a = X(b.lo), c = X(b.hi); return [Math.min(a, c), Math.max(a, c)]; };
      const dens = (b, v) => v / Math.abs(tf(b.hi) - tf(b.lo));
      const max = Math.max(1e-9, ...bins.map((b) => Math.max(dens(b, b.v), b.p != null ? dens(b, b.p) : 0)));
      const Y = (d) => pt + ih - (ih * d) / max;
      let g = "";
      const edges = new Set([bins[0].lo, bins[bins.length - 1].hi]);
      [...bands].sort((a, b) => xs(a)[0] - xs(b)[0]).forEach((b, i) => {
        const [xa, xb] = xs(b);
        if (b.label && xb - xa > 26) g += `<text x="${(xa + xb) / 2}" y="${pt - 6}" text-anchor="middle" style="font-weight:700;fill:var(--text-2)">${b.label}</text>`;
        if (i) g += `<line x1="${xa}" x2="${xa}" y1="${pt - 2}" y2="${pt + ih + 4}" stroke="var(--faint)" stroke-dasharray="2 3"/>`;
        edges.add(b.lo); edges.add(b.hi);
      });
      g += `<line x1="${pl}" x2="${pl + iw}" y1="${pt + ih}" y2="${pt + ih}" stroke="var(--line)"/>`;
      bins.forEach((b, i) => {
        const [x0, x1] = xs(b), w = x1 - x0, gap = w > 6 ? 1.5 : w > 3 ? 1 : 0, y = Y(dens(b, b.v));
        g += `<path class="bar" data-b="${i}" d="${topRounded(x0 + gap / 2, y, Math.max(0.8, w - gap), pt + ih - y, w > 6 ? 2 : 1)}" fill="${b.color}"/>`;
      });
      if (bins.some((b) => b.p != null)) {
        let d = ""; [...bins].sort((a, b) => xs(a)[0] - xs(b)[0]).forEach((b, i) => { const [x0, x1] = xs(b), y = Y(dens(b, b.p || 0)).toFixed(1); d += `${i ? "L" : "M"}${x0.toFixed(1)},${y}H${x1.toFixed(1)}`; });
        g += `<path d="${d}" fill="none" stroke="var(--text-2)" stroke-width="1.25" stroke-linejoin="round" opacity=".7"/>`;
      }
      // axis labels: zone edges first (they matter most), then regular ticks where there's room
      const placed = [], fits = (x) => placed.every((p) => Math.abs(p - x) >= 36);
      const labelAt = (v, txt, bold) => { const x = X(v); if (x < pl - 1 || x > pl + iw + 1 || !fits(x)) return; placed.push(x); g += `<text x="${x}" y="${H - 6}" text-anchor="${x < pl + 14 ? "start" : x > pl + iw - 14 ? "end" : "middle"}" ${bold ? 'style="fill:var(--text-2);font-weight:650"' : ""}>${txt}</text>`; };
      const ev = [...edges]; ev.forEach((v) => labelAt(v, edgeLabel ? xLabel(edgeLabel(v, v === ev[0])) : xLabel(v), true));
      ticks.forEach((v) => labelAt(v, xLabel(v)));
      if (marker) { const mx = X(marker.at); g += `<line x1="${mx}" x2="${mx}" y1="${pt}" y2="${pt + ih}" stroke="var(--text-2)" stroke-dasharray="3 3"/><text x="${mx + 4}" y="${pt + 10}" style="fill:var(--text-2);font-weight:650">${marker.label}</text>`; }
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bins.map((b, i) => { const [x0, x1] = xs(b); return `<rect x="${x0}" y="0" width="${Math.max(1, x1 - x0)}" height="${pt + ih}" fill="transparent" data-i="${i}"/>`; }).join("")}</svg><div class="tip"></div>${foot ? `<div class="note" style="text-align:right;margin:2px 0 0">${foot}</div>` : ""}`;
      const svg = el.querySelector("svg"), tip = el.querySelector(".tip");
      svg.onpointermove = (e) => {
        const t = e.target.closest("[data-i]"); if (!t) return;
        const i = +t.dataset.i, r = svg.getBoundingClientRect(), sx = W / r.width, b = bins[i], [x0, x1] = xs(b);
        svg.querySelectorAll(".bar").forEach((p) => (p.style.opacity = +p.dataset.b === i ? 1 : 0.4));
        tip.innerHTML = b.tip + (b.p != null ? `<br><span class="z">previous: ${hmL(b.p)}</span>` : "");
        tip.style.left = Math.max(90, Math.min(r.width - 90, (x0 + x1) / 2 / sx)) + "px"; tip.classList.add("on");
      };
      svg.onpointerleave = () => { tip.classList.remove("on"); svg.querySelectorAll(".bar").forEach((p) => (p.style.opacity = 1)); };
    }

    // ---- 5 · per sport ----
    function renderTable() {
      const inWin = (x, n) => x.date >= ymd(addDays(today, -(n - 1)));
      const sum = (l) => l.reduce((o, x) => ({ m: o.m + x.m, t: o.t + x.t, n: o.n + 1 }), { m: 0, t: 0, n: 0 });
      const rows = FAM.map(([f, label]) => ({ f, label, w: WIN.map((n) => sum(items.filter((x) => x.f === f && inWin(x, n)))) })).filter((r) => r.w[2].n > 0);
      if (!rows.length) { $("tbl").innerHTML = `<tbody><tr><td class="empty" colspan="4">No activities in the last 28 days yet. Press Sync last 120 days.</td></tr></tbody>`; return; }
      const cell = (x) => (x.m > 0 ? `<b>${(x.m / 1000).toFixed(1)}</b> km<small>${hm(x.t)} h · ${x.n}×</small>` : x.n ? `<b>${hm(x.t)}</b> h<small>${x.n}×</small>` : `<span style="color:var(--faint)">–</span>`);
      const tot = WIN.map((n) => sum(items.filter((x) => inWin(x, n))));
      $("tbl").innerHTML = `<thead><tr><th>Sport</th>${WIN.map((n) => `<th>${n} days</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr><td><span class="s"><i style="background:var(--${r.f})"></i>${r.label}</span></td>${r.w.map((x) => `<td>${cell(x)}</td>`).join("")}</tr>`).join("")}</tbody>
        <tfoot><tr><td>All</td>${tot.map((x) => `<td><b>${(x.m / 1000).toFixed(1)}</b> km<small>${hm(x.t)} h · ${x.n}×</small></td>`).join("")}</tr></tfoot>`;
    }

    $("d-period").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; dPeriod = +b.dataset.v; $("d-period").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); renderDist(); };
    addEventListener("resize", () => { clearTimeout(renderAll.t); renderAll.t = setTimeout(() => daily && (renderRolling(), renderBalance(), renderDist()), 120); });

    // ================= sync =================
    $("sync").onclick = async () => {
      const btn = $("sync"); btn.classList.add("busy"); btn.textContent = "Syncing…";
      try {
        const call = async (body) => {
          const { data, error } = await sb.functions.invoke("garmin", { body });
          if (error) { let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch {} throw new Error(m); }
          return data;
        };
        const data = { activities: 0, linked: 0 };
        // newest 60 days first, then the 60 before (Garmin sync takes at most 62 days per call)
        for (const [a, b] of [[-59, 0], [-119, -60]]) {
          btn.textContent = `Syncing ${a === -59 ? 1 : 2}/2…`;
          const r = await call({ action: "sync", from: ymd(addDays(today, a)), to: ymd(addDays(today, b)) });
          data.activities += r.activities || 0; data.linked += r.linked || 0;
        }
        for (let k = 0; k < 60; k++) {
          const r = await call({ action: "prefetch", from: ymd(addDays(today, -119)), to: ymd(today) });
          if (!r || !r.remaining) break;
          btn.textContent = `Saving activities… ${r.total - r.remaining}/${r.total}`;
        }
        toast(`${data.activities} activities synced and saved · ${data.linked} diary sessions linked`);
        await load();
      } catch (e) { toast(e.message, true); }
      btn.classList.remove("busy"); btn.textContent = "Sync last 120 days";
    };
    $("logout").onclick = () => sb.auth.signOut();

    (async () => {
      const { data } = await sb.auth.getSession();
      if (!data.session) return location.replace("index.html");
      $("who").textContent = data.session.user.email;
      $("app").hidden = false;
      load();
    })();
    sb.auth.onAuthStateChange((e) => { if (e === "SIGNED_OUT") location.replace("index.html"); });
  </script>
</body>
</html>

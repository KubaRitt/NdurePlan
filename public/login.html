<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NdurePlan - Sign In / Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
        }
    </style>
</head>
<body class="text-zinc-900 min-h-screen flex flex-col justify-between selection:bg-zinc-200">

    <!-- Top Logo / Header -->
    <header class="p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-bold text-base tracking-tight hover:opacity-70 transition-opacity font-mono">
                ndure<span class="text-zinc-400">/</span>plan
            </a>
            <a href="index.html" class="text-xs font-medium text-zinc-500 hover:text-zinc-900 flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Home
            </a>
        </div>
    </header>

    <!-- Main Centered Form Card -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-white border border-zinc-200/90 rounded-2xl shadow-xl shadow-zinc-100 p-8 space-y-8 relative">

            <!-- Tab Toggle Button at the very top of the fields -->
            <div class="flex p-1 bg-zinc-100 rounded-xl border border-zinc-200/40" id="auth-toggle">
                <button type="button" onclick="setAuthTab('login')" id="btn-login-tab" class="flex-1 text-center py-2 text-xs font-semibold rounded-lg transition-all bg-white text-zinc-900 shadow-sm">
                    Sign In
                </button>
                <button type="button" onclick="setAuthTab('register')" id="btn-register-tab" class="flex-1 text-center py-2 text-xs font-semibold rounded-lg transition-all text-zinc-500 hover:text-zinc-900">
                    Create Account
                </button>
            </div>

            <!-- Headers depending on active state -->
            <div class="text-center space-y-2">
                <h2 id="auth-title" class="text-xl font-bold tracking-tight text-zinc-900">Welcome Back</h2>
                <p id="auth-subtitle" class="text-xs text-zinc-400 font-light">Enter your email and password to access your athletic sessions</p>
            </div>

            <!-- Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <!-- Email Field -->
                <div class="space-y-1.5ClassName">
                    <label for="email" class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider block">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="email" id="email" required placeholder="name@example.com" class="w-full pl-10 pr-4 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-1.5">
                    <label for="password" class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider block">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-zinc-50/50 border border-zinc-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900 transition-all">
                    </div>
                </div>

                <!-- Live Notification/Message Box -->
                <div id="auth-message" class="hidden p-3 rounded-lg text-xs font-medium"></div>

                <!-- Submit Button -->
                <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-zinc-950 text-white font-medium text-sm rounded-xl hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-950/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <span>Continue</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Extra Support text -->
            <div class="text-center font-mono text-[10px] text-zinc-400 pt-2 border-t border-zinc-100">
                NdurePlan utilizes modern client-side storage simulation for instant testing.
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 border-t border-zinc-200/40 bg-zinc-50 text-center text-xs text-zinc-400 font-light">
        &copy; 2026 NdurePlan. Designed for true performance athletes.
    </footer>

    <script type="module">
        import { signUpAthlete, signInAthlete } from './supabase_api.js';

        // Track the auth state
        let currentTab = 'login'; // 'login' or 'register'

        // Read query parameters to specify default tab
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'register') {
            setAuthTab('register');
        }

        function setAuthTab(tab) {
            currentTab = tab;
            const btnLogin = document.getElementById('btn-login-tab');
            const btnRegister = document.getElementById('btn-register-tab');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (tab === 'login') {
                // Style tab active
                btnLogin.className = "flex-1 text-center py-2 text-xs font-semibold rounded-lg transition-all bg-white text-zinc-900 shadow-sm";
                btnRegister.className = "flex-1 text-center py-2 text-xs font-semibold rounded-lg transition-all text-zinc-500 hover:text-zinc-900";

                // Labels
                title.textContent = "Welcome Back";
                subtitle.textContent = "Enter your email and password to access your athletic sessions";
                submitBtn.innerHTML = `<span>Sign In to Dashboard</span><i data-lucide="chevron-right" class="w-4 h-4"></i>`;
            } else {
                // Style tab active
                btnRegister.className = "flex-1 text-center py-2 text-xs font-semibold rounded-lg transition-all bg-white text-zinc-900 shadow-sm";
                btnLogin.className = "flex-1 text-center py-2 text-xs font-semibold rounded-lg transition-all text-zinc-500 hover:text-zinc-900";

                // Labels
                title.textContent = "Create an Account";
                subtitle.textContent = "Enter your details to structure training blocks and heart rate zones";
                submitBtn.innerHTML = `<span>Create Free Account</span><i data-lucide="user-plus" class="w-4 h-4"></i>`;
            }

            // Hide message on tab change
            document.getElementById('auth-message').className = "hidden p-3 rounded-lg text-xs font-medium";
            lucide.createIcons();
        }

        function showMessage(text, variant) {
            const messageBox = document.getElementById('auth-message');
            const styles = {
                success: "p-3 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200/50 block",
                error: "p-3 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200/50 block",
                info: "p-3 rounded-lg text-xs font-medium bg-zinc-50 text-zinc-600 border border-zinc-200/50 block"
            };
            messageBox.className = styles[variant] || styles.info;
            messageBox.textContent = text;
        }

        function setSubmitLoading(isLoading) {
            const submitBtn = document.getElementById('auth-submit-btn');
            submitBtn.disabled = isLoading;
            submitBtn.classList.toggle('opacity-60', isLoading);
            submitBtn.classList.toggle('cursor-not-allowed', isLoading);
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return;

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters long.", "error");
                return;
            }

            setSubmitLoading(true);

            try {
                if (currentTab === 'login') {
                    showMessage("Authenticating...", "info");
                    await signInAthlete(email, password);
                    showMessage("Signed in. Loading your athletic planner...", "success");
                } else {
                    showMessage("Creating your account...", "info");
                    const data = await signUpAthlete(email, password);

                    // If email confirmation is enabled in Supabase Auth settings,
                    // there is no session yet — the profiles row is still created
                    // by the DB trigger, but the user must confirm before signing in.
                    if (!data.session) {
                        showMessage(
                            "Account created! Check your email to confirm before signing in.",
                            "success"
                        );
                        setSubmitLoading(false);
                        return;
                    }

                    showMessage("Account created! Initializing your athletic planner...", "success");
                }

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            } catch (err) {
                showMessage(err.message || "Something went wrong. Please try again.", "error");
                setSubmitLoading(false);
            }
        }

        // Expose handlers used by inline onclick/onsubmit attributes
        // (required since this is now a module script, which doesn't
        // leak declarations onto window automatically)
        window.setAuthTab = setAuthTab;
        window.handleAuthSubmit = handleAuthSubmit;

        // Initialize lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
